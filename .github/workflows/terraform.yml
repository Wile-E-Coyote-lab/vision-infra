name: terraform

on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: ["main"]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_VAR_project_id: ${{ vars.PROJECT_ID }}
  TF_VAR_region: ${{ vars.REGION }}
  TF_VAR_zone: ${{ vars.ZONE }}
  TF_VAR_operator_member: ${{ vars.OPERATOR_MEMBER }}

jobs:
  terraform:
    # Skips cleanly until bootstrap + set-vars have been run
    if: ${{ vars.WIF_PROVIDER != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=android-host"

      - name: Validate
        run: terraform validate

      - name: Run action
        env:
          INPUT_ACTION: ${{ inputs.action }}
          EVENT: ${{ github.event_name }}
        run: |
          ACTION="$INPUT_ACTION"
          if [ -z "$ACTION" ]; then
            if [ "$EVENT" = "pull_request" ]; then ACTION=plan; else ACTION=apply; fi
          fi
          echo "action=$ACTION"
          case "$ACTION" in
            plan)    terraform plan -input=false ;;
            apply)   terraform plan -input=false -out=tfplan && terraform apply -input=false tfplan ;;
            destroy) terraform plan -destroy -input=false -out=tfplan && terraform apply -input=false tfplan ;;
            *) echo "unknown action"; exit 1 ;;
          esac
